// --- MODULE VẼ SƠ ĐỒ (ĐÃ SỬA LỖI V3.3) ---
    const GRID_SIZE = 5;
    const COLORS = { wire: '#000000', grid: '#e2e8f0', pvlv: '#ef4444', highlight: '#3b82f6', text: '#000000' };
    
    // ĐỊNH NGHĨA CSS CLASS (Sửa lỗi ReferenceError)
    const TOOL_BTN_CLASS = "flex flex-col items-center justify-center px-2 py-1 rounded border border-transparent hover:bg-gray-100 min-w-[55px] transition-colors cursor-pointer active:bg-gray-200 touch-manipulation";
    const ACTION_BTN_CLASS = "flex items-center gap-2 border px-3 py-2 rounded-full shadow-md bg-white hover:bg-gray-50 transition-all active:scale-95 cursor-pointer text-sm font-medium whitespace-nowrap touch-manipulation";
    
    const snapToGrid = (val) => Math.round(val / GRID_SIZE) * GRID_SIZE;
    
// --- COMPONENT TRÌNH VẼ SƠ ĐỒ (ĐÃ SỬA: TỰ ĐỘNG CĂN GIỮA TRÊN MOBILE) ---
    const DiagramEditor = ({ initialData, onSave, onClose }) => {
        const [objects, setObjects] = useState(initialData || []);
        const [selectedId, setSelectedId] = useState(null);
        const [showTemplateModal, setShowTemplateModal] = useState(false);
        const [templates, setTemplates] = useState([]);
        const [loadingTemplates, setLoadingTemplates] = useState(false);
        const [viewport, setViewport] = useState({ x: 0, y: 0, scale: 1 });
        const [isPanning, setIsPanning] = useState(false);
        const [lastPanPoint, setLastPanPoint] = useState({ x: 0, y: 0 });
        const [dragState, setDragState] = useState({ isDragging: false, draggedId: null, startX: 0, startY: 0, initialObj: null, type: 'move', handle: null });

        // --- HÀM MỚI: TỰ ĐỘNG CĂN GIỮA & CO GIÃN (AUTO FIT) ---
        const fitToScreen = (items) => {
            if (!items || items.length === 0) {
                // Nếu không có hình, về giữa màn hình
                setViewport({ x: window.innerWidth / 2, y: window.innerHeight / 2, scale: 1 });
                return;
            }

            // 1. Tìm biên (bounds) của tất cả hình vẽ
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            
            items.forEach(obj => {
                if (obj.type === 'line') {
                    minX = Math.min(minX, obj.x1, obj.x2); maxX = Math.max(maxX, obj.x1, obj.x2);
                    minY = Math.min(minY, obj.y1, obj.y2); maxY = Math.max(maxY, obj.y1, obj.y2);
                } else if (obj.type === 'rect_pvlv') {
                    minX = Math.min(minX, obj.x); maxX = Math.max(maxX, obj.x + obj.width);
                    minY = Math.min(minY, obj.y); maxY = Math.max(maxY, obj.y + obj.height);
                } else {
                    // Các icon, text, circle (tâm cx, cy hoặc x, y)
                    const x = obj.x !== undefined ? obj.x : obj.cx;
                    const y = obj.y !== undefined ? obj.y : obj.cy;
                    const size = 40; // Kích thước ước lượng
                    minX = Math.min(minX, x - size); maxX = Math.max(maxX, x + size);
                    minY = Math.min(minY, y - size); maxY = Math.max(maxY, y + size);
                }
            });

            // 2. Tính toán tỷ lệ zoom và vị trí
            const padding = 40; // Khoảng cách lề
            const contentWidth = maxX - minX + padding * 2;
            const contentHeight = maxY - minY + padding * 2;
            
            const screenW = window.innerWidth;
            const screenH = window.innerHeight - 100; // Trừ hao thanh công cụ
            
            // Tính scale sao cho vừa khít
            let newScale = Math.min(screenW / contentWidth, screenH / contentHeight);
            newScale = Math.min(newScale, 1.2); // Không zoom quá to (max 1.2)
            newScale = Math.max(newScale, 0.3); // Không quá nhỏ
            
            // Tính toán vị trí để đưa về giữa màn hình
            const contentCenterX = (minX + maxX) / 2;
            const contentCenterY = (minY + maxY) / 2;
            
            const newX = (screenW / 2) - (contentCenterX * newScale);
            const newY = (screenH / 2) - (contentCenterY * newScale);

            setViewport({ x: newX, y: newY, scale: newScale });
        };

        // Khi mở lên, nếu có dữ liệu cũ -> Tự động Fit
        useEffect(() => {
            if (initialData && initialData.length > 0) {
                // Delay nhẹ để DOM render xong mới tính toán chuẩn kích thước màn hình
                setTimeout(() => fitToScreen(initialData), 50);
            } else {
                // Nếu tạo mới, đặt tâm ở giữa màn hình
                const cx = snapToGrid(window.innerWidth / 2);
                const cy = snapToGrid(window.innerHeight / 2 - 50);
                
                // Tạo mẫu mặc định nằm ngay giữa
                setObjects([
                    { id: 'line_src', type: 'line', x1: cx - 80, y1: cy, x2: cx + 80, y2: cy, strokeWidth: 2, dash: false },
                    { id: 'txt_src', type: 'text', x: cx, y: cy - 20, text: "Tuyến...", fontSize: 14, rotate: 0 },
                    { id: 'dev_fco', type: 'icon_device', subType: 'FCO', x: cx, y: cy + 60, label: "FCO" },
                    { id: 'line_br', type: 'line', x1: cx, y1: cy, x2: cx, y2: cy + 150, strokeWidth: 2, dash: false },
                    { id: 'junc', type: 'circle', cx: cx, cy: cy, r: 4, fill: 'black' },
                    { id: 'load', type: 'icon_load', subType: 'TBA', x: cx, y: cy + 150, label: "TBA..." }
               ]);
               // Reset viewport về 0,0 (vì đã tính tọa độ cx, cy theo màn hình rồi)
               setViewport({ x: 0, y: 0, scale: 1 });
            }
        }, []);
        
        const fetchTemplates = async () => {
            setLoadingTemplates(true);
            
            // 1. Bỏ qua việc lấy mẫu từ LocalStorage (để tránh trùng lặp)
            let cloudTemplates = [];
            
            // 2. Chỉ lấy từ Supabase
            try { 
                const { data, error } = await supabase
                    .from('diagram_templates')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (!error && data) cloudTemplates = data; 
            } catch(e) {
                console.error("Lỗi tải mẫu:", e);
            }

            // 3. Cập nhật danh sách (Chỉ còn dữ liệu Cloud)
            setTemplates(cloudTemplates);
            setLoadingTemplates(false);
        };

        const handleSaveTemplate = async () => {
            const name = prompt("Nhập tên mẫu để lưu:");
            if (!name) return;
            
            const newTplData = { name: name, data: objects };
            
            try {
                // --- SỬA: BỎ LƯU LOCAL, CHỈ LƯU SUPABASE ---
                const { error } = await supabase.from('diagram_templates').insert([newTplData]);
                
                if (error) throw error;

                alert("Đã lưu mẫu thành công!"); 
                fetchTemplates();
            } catch (e) { 
                alert("Lỗi lưu mẫu: " + e.message); 
            }
        };
        const handleDeleteTemplate = async (id, e) => {
            e.stopPropagation(); if(!confirm("Bạn có chắc muốn xóa mẫu này?")) return;
            if (String(id).startsWith('local_')) {
                const local = JSON.parse(localStorage.getItem('local_diagram_templates') || '[]');
                localStorage.setItem('local_diagram_templates', JSON.stringify(local.filter(t => t.id !== id))); fetchTemplates();
            } else { await supabase.from('diagram_templates').delete().eq('id', id); fetchTemplates(); }
        };
        
        // --- CẬP NHẬT HÀM LOAD MẪU: Gọi fitToScreen ---
        const handleLoadTemplate = (tpl) => { 
            if(confirm(`Dùng mẫu "${tpl.name}"?`)) { 
                setObjects(tpl.data); 
                setShowTemplateModal(false);
                // Tự động căn giữa sau khi load
                setTimeout(() => fitToScreen(tpl.data), 50);
            } 
        };

        const openTemplateModal = () => { setShowTemplateModal(true); fetchTemplates(); };
        const screenToWorld = (screenX, screenY) => ({ x: (screenX - viewport.x) / viewport.scale, y: (screenY - viewport.y) / viewport.scale });
        
        const handlePointerDown = (e) => {
            if (e.target.closest('button')) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX; const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            if (e.touches && e.touches.length > 1) return;
            const targetIsObject = e.target.getAttribute('data-type') === 'object';

                    if (obj.type === 'icon_load') return (<g key={obj.id} transform={`translate(${obj.x}, ${obj.y})`}>{obj.subType === 'TBA' ? (<g stroke="black" strokeWidth="2" fill="none"><circle cx="0" cy="0" r="18" fill="white"/><polygon points="0,-18 15.58,9 -15.58,9" fill="none" stroke="black" strokeWidth="2"/></g>) : (<rect x="-18" y="-25" width="36" height="50" fill="white" stroke="black" strokeWidth="2"/>)}<text x="25" y="5" fontSize="12" fontWeight="bold">{obj.label}</text></g>);
                    if (obj.type === 'icon_ground') {const dx = obj.direction === 'left' ? -20 : 20;return (<g key={obj.id} transform={`translate(${obj.x}, ${obj.y})`}><line x1={dx} y1={-20} x2="0" y2="0" stroke="black" strokeWidth="2"/><circle cx={dx} cy={-20} r="3" fill="black"/><line x1="-15" y1="0" x2="15" y2="0" stroke="black" strokeWidth="2"/><line x1="-10" y1="4" x2="10" y2="4" stroke="black" strokeWidth="2"/><line x1="-5" y1="8" x2="5" y2="8" stroke="black" strokeWidth="2"/></g>);}
                    if (obj.type === 'icon_ground_lv') {const isLeft = obj.direction === 'left';const barX = isLeft ? -10 : 10;const barY = 10;const rectX = isLeft ? -20 : 0;const rectY = 0;return (<g key={obj.id} transform={`translate(${obj.x}, ${obj.y})`} stroke="black" strokeWidth="1.5"><circle cx="0" cy="0" r="2" fill="black" stroke="none"/><line x1="0" y1="0" x2={barX} y2={10}/><line x1={barX-8} y1={10} x2={barX+8} y2={10}/><line x1={barX-5} y1={13} x2={barX+5} y2={13}/><line x1={barX-2} y1={16} x2={barX+2} y2={16}/></g>);}
                    if (obj.type === 'text') return <text key={obj.id} x={obj.x} y={obj.y} fontSize={obj.fontSize} fill="black" transform={`rotate(${obj.rotate||0}, ${obj.x}, ${obj.y})`}>{obj.text}</text>;
                    if (obj.type === 'rect_pvlv') return <g key={obj.id} transform={`translate(${obj.x}, ${obj.y})`}><rect width={obj.width} height={obj.height} fill="rgba(239, 68, 68, 0.05)" stroke={COLORS.pvlv} strokeWidth="2" strokeDasharray="5 5"/><text x="5" y="15" fill={COLORS.pvlv} fontSize="10" fontWeight="bold">PVLV</text></g>;
                    return null;
                })}
            </svg>
        );
    };

    const TimeSelect = ({ value, onChange }) => {
        const [hour, minute] = value ? value.split(':') : ['07', '00'];
        const hours = Array.from({length: 24}, (_, i) => i.toString().padStart(2, '0'));
        const minutes = Array.from({length: 60}, (_, i) => i.toString().padStart(2, '0'));
        const handleChange = (type, val) => {
            let newH = hour, newM = minute;
            if (type === 'h') newH = val;
            if (type === 'm') newM = val;
            onChange(`${newH}:${newM}`);
        };
        return (
            <div className="inline-flex items-center border-b-2 border-gray-300 hover:border-blue-500 bg-transparent gap-0 transition-colors">
                <select value={hour} onChange={(e) => handleChange('h', e.target.value)} className="appearance-none bg-transparent font-bold text-center outline-none cursor-pointer p-1 text-gray-800 hover:bg-gray-100 rounded">
                    {hours.map(h => <option key={h} value={h}>{h}</option>)}
                </select>
                <span className="font-bold px-0.5">:</span>
                <select value={minute} onChange={(e) => handleChange('m', e.target.value)} className="appearance-none bg-transparent font-bold text-center outline-none cursor-pointer p-1 text-gray-800 hover:bg-gray-100 rounded">
                    {minutes.map(m => <option key={m} value={m}>{m}</option>)}
                </select>
            </div>
        );
    };

    const QuickInputSection = ({ title, value, onChange, templates, placeholder, contextData }) => {
        // 1. Tạo tham chiếu để tương tác với thanh cuộn
        const scrollRef = useRef(null);

        // 2. Thêm sự kiện: Khi lăn chuột tại vùng này -> chuyển thành lăn ngang
        useEffect(() => {
            const el = scrollRef.current;
            if (el) {
                const onWheel = (e) => {
                    if (e.deltaY === 0) return;
                    e.preventDefault();
                    el.scrollLeft += e.deltaY; 
                };
                el.addEventListener('wheel', onWheel, { passive: false });
                return () => el.removeEventListener('wheel', onWheel);
            }
        }, []);

        const addTemplate = (templateObj) => {
            // Logic lấy nội dung từ object mẫu
            let textToAdd = templateObj.content || templateObj; // Hỗ trợ cả object cũ và mới

            if (contextData) {
                const fullPoleCode = `${contextData.code}${contextData.sub ? "/" + contextData.sub : ""}`;
                const mainPoleCode = contextData.code || "...";
                
                textToAdd = textToAdd
                    .replace(/{tru_chinh}/g, mainPoleCode)
                    .replace(/{tru}/g, fullPoleCode)
                    .replace(/{tuyen}/g, contextData.line || "...");
            }
            
            // Logic nối chuỗi: Nếu inline=true thì dùng dấu phẩy, ngược lại xuống dòng
            const separator = templateObj.inline ? " " : "\n";
            const newValue = value ? value + separator + textToAdd : textToAdd;
            
            onChange(newValue);
        };

        return (
            <div className="mb-4">
                <label className="section-title block text-gray-800">{title}</label>
                <div ref={scrollRef} className="flex gap-2 overflow-x-auto no-scrollbar mb-2 pb-1 cursor-grab active:cursor-grabbing">
                    {templates.map((t, i) => (
                        <button key={i} onClick={() => addTemplate(t)} className="tag-btn flex-shrink-0">
                            <UI_Icons.Plus size={12}/> {t.label}
                        </button>
                    ))}
                    <button onClick={() => onChange("")} className="tag-btn flex-shrink-0 bg-red-50 text-red-600 border-red-200">Xóa</button>
                </div>
                <textarea className="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" rows="4" value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder}></textarea>
            </div>
        );
    }; // <--- BẠN HAY BỊ THIẾU DẤU NÀY

    // --- MODAL XEM ẢNH (QUẢN LÝ) ---
    const ImageGalleryModal = ({ images, onClose, onZoom }) => {
        if (!images) return null;
        return (
            <div className="fixed inset-0 z-[10000] bg-black/90 flex flex-col" onClick={onClose}>
                <div className="p-4 flex justify-between items-center text-white shrink-0 bg-black/50 backdrop-blur-sm">
                    <h3 className="font-bold text-lg flex items-center gap-2"><UI_Icons.Share2/> Hình ảnh hiện trường ({images.length})</h3>
                    <button onClick={onClose} className="p-2 bg-white/20 rounded-full hover:bg-white/30 transition-colors"><UI_Icons.X/></button>
                </div>
                <div className="flex-1 overflow-y-auto p-4 grid grid-cols-2 md:grid-cols-4 gap-4 content-start">
                    {images.length === 0 ? (
                        <div className="col-span-full text-center text-gray-500 mt-20 flex flex-col items-center">
                            <UI_Icons.Share2 size={48} className="mb-2 opacity-50"/>
                            <span>Không có hình ảnh nào</span>
                        </div>
                    ) : (
                        images.map((url, i) => (
                            <div key={i} className="relative rounded-lg overflow-hidden border border-gray-700 aspect-square group cursor-pointer" onClick={(e) => { e.stopPropagation(); onZoom(url); }}>
                                <img src={url} className="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" alt="Evidence" loading="lazy"/>
                                <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-end justify-end p-2 pointer-events-none">
                                    <div className="text-white text-xs font-bold flex items-center gap-1"><UI_Icons.ZoomIn size={16}/> Xem to</div>
                                </div>
                            </div>
                        ))
                    )}
                </div>
            </div>
        );
    };

// --- COMPONENT QUẢN LÝ MỐI NGUY (V4 - CÓ XEM CHI TIẾT TRONG DANH SÁCH) ---
    const RiskManagerModal = ({ isOpen, onClose, onRefresh, existingRisks }) => {
        // mode: 'create' | 'update' | 'list'
        const [mode, setMode] = useState('create');
        const [selectedRiskId, setSelectedRiskId] = useState(""); // Dùng cho tab Update
        const [expandedRiskId, setExpandedRiskId] = useState(null); // Dùng cho tab List (để mở rộng)
        
        // State chung
        const [name, setName] = useState("");
        const [type, setType] = useState("ATLĐ");
        const [level, setLevel] = useState("II");
        const [desc, setDesc] = useState("");
        const [measure, setMeasure] = useState("");
        
        // State chứa dữ liệu chi tiết (Dùng chung cho cả Update và List View)
        const [existingDescs, setExistingDescs] = useState([]);
        const [existingMeasures, setExistingMeasures] = useState([]);

        const [loading, setLoading] = useState(false);
        const [detailLoading, setDetailLoading] = useState(false);

        // Reset khi mở modal hoặc chuyển tab
        useEffect(() => { 
            if (isOpen) { 
                setMode('create'); setSelectedRiskId(""); setExpandedRiskId(null);
                setName(""); setDesc(""); setMeasure(""); 
                setExistingDescs([]); setExistingMeasures([]);
            } 
        }, [isOpen]);

        // Logic tải chi tiết khi chọn mối nguy ở tab UPDATE
        useEffect(() => {
            const fetchDetailsForUpdate = async () => {
                if (mode === 'update' && selectedRiskId) {
                    setLoading(true);
                    await fetchRiskDetails(selectedRiskId);
                    setLoading(false);
                } else if (mode === 'update') {
                    setExistingDescs([]); setExistingMeasures([]);
                }
            };
            fetchDetailsForUpdate();
        }, [selectedRiskId, mode]);

        // Hàm dùng chung để tải chi tiết (Mô tả + Biện pháp)
        const fetchRiskDetails = async (id) => {
            const { data: dData } = await supabase.from('dm_mo_ta').select('*').eq('moi_nguy_id', id).order('id');
            if (dData) setExistingDescs(dData);
            const { data: mData } = await supabase.from('dm_bien_phap').select('*').eq('moi_nguy_id', id).order('id');
            if (mData) setExistingMeasures(mData);
        };

        // --- XỬ LÝ KHI BẤM VÀO DÒNG TRONG DANH SÁCH (LIST) ---
        const handleToggleDetail = async (riskId) => {
            if (expandedRiskId === riskId) {
                // Nếu đang mở thì đóng lại
                setExpandedRiskId(null);
            } else {
                // Mở dòng mới -> Tải dữ liệu
                setExpandedRiskId(riskId);
                setDetailLoading(true);
                await fetchRiskDetails(riskId);
                setDetailLoading(false);
            }
        };

        // --- HÀM XÓA CHI TIẾT ---
        const handleDeleteDetail = async (table, id) => {
            if(!confirm("Xóa dòng chi tiết này?")) return;
            const { error } = await supabase.from(table).delete().eq('id', id);
            if (error) alert("Lỗi xóa: " + error.message);
            else {
                if (table === 'dm_mo_ta') setExistingDescs(prev => prev.filter(i => i.id !== id));
                if (table === 'dm_bien_phap') setExistingMeasures(prev => prev.filter(i => i.id !== id));
            }
        };

        // --- HÀM XÓA MỐI NGUY ---
        const handleDeleteRisk = async (id, riskName, e) => {
            e.stopPropagation(); // Ngăn sự kiện click lan ra cha (gây mở rộng dòng)
            if(!confirm(`CẢNH BÁO: Xóa mối nguy "${riskName}" sẽ xóa tất cả dữ liệu bên trong nó. Tiếp tục?`)) return;
            
            setLoading(true);
            try {
                await supabase.from('dm_mo_ta').delete().eq('moi_nguy_id', id);
                await supabase.from('dm_bien_phap').delete().eq('moi_nguy_id', id);
                const { error } = await supabase.from('dm_moi_nguy').delete().eq('id', id);
                if (error) throw error;
                alert("Đã xóa thành công!");
                onRefresh();
            } catch (err) {
                alert("Lỗi khi xóa: " + err.message);
            } finally {
                setLoading(false);
            }
        };

        const handleUpdateLocal = (type, index, val) => {
            if (type === 'desc') { const newArr = [...existingDescs]; newArr[index].noi_dung = val; setExistingDescs(newArr); } 
            else { const newArr = [...existingMeasures]; newArr[index].noi_dung = val; setExistingMeasures(newArr); }
        };

        const handleSave = async () => {
            setLoading(true); 
            let targetRiskId = selectedRiskId;

            if (mode === 'create') {
                if (!name.trim()) { alert("Vui lòng nhập tên mối nguy!"); setLoading(false); return; }
                const { data, error } = await supabase.from('dm_moi_nguy').insert([{ ten_moi_nguy: name.trim(), bac_rr_mac_dinh: level, loai: type }]).select();
                if (error) { alert("Lỗi lưu: " + error.message); setLoading(false); return; }
                targetRiskId = data[0].id;
            } else if (mode === 'update') { 
                if (!targetRiskId) { alert("Vui lòng chọn mối nguy!"); setLoading(false); return; } 
                for (const item of existingDescs) { await supabase.from('dm_mo_ta').update({ noi_dung: item.noi_dung }).eq('id', item.id); }
                for (const item of existingMeasures) { await supabase.from('dm_bien_phap').update({ noi_dung: item.noi_dung }).eq('id', item.id); }
            }

            const descInserts = desc.split('\n').map(l => l.trim()).filter(l => l).map(d => ({ moi_nguy_id: targetRiskId, noi_dung: d }));
            const measureInserts = measure.split('\n').map(l => l.trim()).filter(l => l).map(m => ({ moi_nguy_id: targetRiskId, noi_dung: m }));
            
            if (descInserts.length > 0) await supabase.from('dm_mo_ta').insert(descInserts);
            if (measureInserts.length > 0) await supabase.from('dm_bien_phap').insert(measureInserts);

            alert("Đã lưu thành công!"); onRefresh(); 
            if(mode === 'create') { setName(""); setDesc(""); setMeasure(""); }
            setLoading(false);
        };

        const atldList = existingRisks.filter(r => r.loai === 'ATLĐ' || r.loai === 'ATLD');
        const vsldList = existingRisks.filter(r => r.loai === 'VSLĐ' || r.loai === 'VSLD');

        // Render từng dòng trong danh sách
        const renderRiskRow = (r) => {
            const isExpanded = expandedRiskId === r.id;
            return (
                <div key={r.id} className="border rounded bg-white shadow-sm overflow-hidden mb-2 transition-all">
                    {/* Header dòng: Click để mở rộng */}
                    <div 
                        className={`flex justify-between items-center p-3 cursor-pointer hover:bg-gray-50 ${isExpanded ? 'bg-blue-50 border-b border-blue-100' : ''}`}
                        onClick={() => handleToggleDetail(r.id)}
                    >
                        <div className="flex items-center gap-2">
                            {isExpanded ? <UI_Icons.Minus size={14}/> : <UI_Icons.Plus size={14}/>}
                            <div>
                                <div className="font-bold text-sm text-gray-800">{r.ten_moi_nguy}</div>
                                <div className="text-xs text-gray-500">Bậc rủi ro: <span className="font-semibold text-blue-600">{r.bac_rr_mac_dinh}</span></div>
                            </div>
                        </div>
                        <button onClick={(e) => handleDeleteRisk(r.id, r.ten_moi_nguy, e)} className="text-gray-400 hover:text-red-500 p-2 rounded transition-colors" title="Xóa toàn bộ">
                            <UI_Icons.Trash2 size={18}/>
                        </button>
                    </div>

                    {/* Nội dung chi tiết (Chỉ hiện khi Expanded) */}
                    {isExpanded && (
                        <div className="p-3 bg-gray-50 text-sm animate-zoom-in">
                            {detailLoading ? (
                                <div className="text-center text-gray-500 py-2">Đang tải chi tiết...</div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {/* Cột Mô Tả */}
                                    <div>
                                        <div className="font-bold text-gray-700 mb-1 border-b border-gray-200 pb-1">Mô tả / Nguyên nhân:</div>
                                        {existingDescs.length === 0 ? <div className="text-gray-400 italic text-xs">Chưa có mô tả</div> : (
                                            <ul className="list-disc list-inside space-y-1 text-gray-700">
                                                {existingDescs.map(d => <li key={d.id} className="pl-1">{d.noi_dung}</li>)}
                                            </ul>
                                        )}
                                    </div>
                                    {/* Cột Biện Pháp */}
                                    <div>
                                        <div className="font-bold text-gray-700 mb-1 border-b border-gray-200 pb-1">Biện pháp kiểm soát:</div>
                                        {existingMeasures.length === 0 ? <div className="text-gray-400 italic text-xs">Chưa có biện pháp</div> : (
                                            <ul className="list-disc list-inside space-y-1 text-gray-700">
                                                {existingMeasures.map(m => <li key={m.id} className="pl-1">{m.noi_dung}</li>)}
                                            </ul>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        if (!isOpen) return null;

        return (
            <div className="fixed inset-0 bg-black/50 z-[150] flex items-center justify-center p-4" onClick={onClose}>
                <div className="bg-white rounded-lg shadow-xl w-full max-w-lg flex flex-col max-h-[90vh]" onClick={e => e.stopPropagation()}>
                    <div className="p-4 border-b bg-blue-600 text-white rounded-t-lg flex justify-between items-center">
                        <h3 className="font-bold text-lg flex items-center gap-2"><UI_Icons.Database /> Quản Lý Thư Viện</h3>
                        <button onClick={onClose}><UI_Icons.X size={20}/></button>
                    </div>
                    
                    <div className="p-4 overflow-y-auto flex-1 space-y-4">
                        {/* Tab chuyển đổi */}
                        <div className="flex border rounded overflow-hidden mb-4 shadow-sm bg-gray-100 p-1 gap-1">
                            <button className={`flex-1 py-1.5 rounded font-bold text-sm transition-all ${mode === 'create' ? 'bg-white text-blue-700 shadow' : 'text-gray-500 hover:bg-gray-200'}`} onClick={() => setMode('create')}>Tạo Mới</button>
                            <button className={`flex-1 py-1.5 rounded font-bold text-sm transition-all ${mode === 'update' ? 'bg-white text-blue-700 shadow' : 'text-gray-500 hover:bg-gray-200'}`} onClick={() => setMode('update')}>Sửa ND</button>
                            <button className={`flex-1 py-1.5 rounded font-bold text-sm transition-all ${mode === 'list' ? 'bg-white text-blue-700 shadow' : 'text-gray-500 hover:bg-gray-200'}`} onClick={() => setMode('list')}>Danh Sách</button>
                        </div>

                        {/* --- TAB 1: TẠO MỚI --- */}
                        {mode === 'create' && (
                            <div className="space-y-3 bg-gray-50 p-3 rounded border">
                                <div><label className="block text-sm font-bold text-gray-700 mb-1">Tên mối nguy *</label><input className="w-full border rounded p-2" value={name} onChange={e => setName(e.target.value)} placeholder="VD: Làm việc trên cao" /></div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="block text-sm font-bold text-gray-700 mb-1">Loại</label><select className="w-full border rounded p-2" value={type} onChange={e => setType(e.target.value)}><option value="ATLĐ">ATLĐ</option><option value="VSLĐ">VSLĐ</option></select></div>
                                    <div><label className="block text-sm font-bold text-gray-700 mb-1">Bậc RR</label><select className="w-full border rounded p-2" value={level} onChange={e => setLevel(e.target.value)}><option value="II">II</option><option value="I">I</option><option value="III">III</option><option value="IV">IV</option><option value="V">V</option></select></div>
                                </div>
                            </div>
                        )}

                        {/* --- TAB 2: CẬP NHẬT --- */}
                        {mode === 'update' && (
                            <div className="bg-yellow-50 p-3 rounded border border-yellow-200">
                                <label className="block text-sm font-bold text-gray-700 mb-1">Chọn mối nguy cần sửa *</label>
                                <select className="w-full border rounded p-2 font-bold text-blue-800" value={selectedRiskId} onChange={e => setSelectedRiskId(e.target.value)}>
                                    <option value="">-- Chọn mối nguy --</option>
                                    {existingRisks.map(r => (<option key={r.id} value={r.id}>{r.ten_moi_nguy} ({r.loai})</option>))}
                                </select>
                            </div>
                        )}

                        {/* --- TAB 3: DANH SÁCH (CÓ EXPAND) --- */}
                        {mode === 'list' && (
                            <div className="space-y-6">
                                {/* Nhóm ATLĐ */}
                                <div>
                                    <div className="bg-blue-100 text-blue-800 px-3 py-1.5 font-bold text-sm rounded mb-2 sticky top-0 z-10 border border-blue-200">ATLĐ (An toàn lao động)</div>
                                    <div className="space-y-1">
                                        {atldList.length === 0 ? <div className="text-gray-400 italic text-xs ml-2">Chưa có dữ liệu</div> : atldList.map(r => renderRiskRow(r))}
                                    </div>
                                </div>
                                {/* Nhóm VSLĐ */}
                                <div>
                                    <div className="bg-green-100 text-green-800 px-3 py-1.5 font-bold text-sm rounded mb-2 sticky top-0 z-10 border border-green-200">VSLĐ (Vệ sinh lao động)</div>
                                    <div className="space-y-1">
                                        {vsldList.length === 0 ? <div className="text-gray-400 italic text-xs ml-2">Chưa có dữ liệu</div> : vsldList.map(r => renderRiskRow(r))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* --- PHẦN NHẬP CHI TIẾT (Create & Update) --- */}
                        {(mode === 'create' || mode === 'update') && (
                            <>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">Mô tả (Nguyên nhân):</label>
                                    {mode === 'update' && existingDescs.length > 0 && (
                                        <div className="mb-2 space-y-2 max-h-40 overflow-y-auto border p-2 rounded bg-gray-50">
                                            {existingDescs.map((item, i) => (
                                                <div key={item.id} className="flex gap-2 items-center">
                                                    <input className="flex-1 border rounded px-2 py-1 text-sm text-gray-700" value={item.noi_dung} onChange={(e) => handleUpdateLocal('desc', i, e.target.value)} />
                                                    <button onClick={() => handleDeleteDetail('dm_mo_ta', item.id)} className="text-red-500 hover:bg-red-100 p-1 rounded"><UI_Icons.Trash2 size={16}/></button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                    <textarea className="w-full border rounded p-2 focus:ring-2 focus:ring-blue-200 outline-none" rows="2" placeholder="Nhập mô tả mới (xuống dòng để tách ý)..." value={desc} onChange={e => setDesc(e.target.value)}></textarea>
                                </div>

                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">Biện pháp kiểm soát:</label>
                                    {mode === 'update' && existingMeasures.length > 0 && (
                                        <div className="mb-2 space-y-2 max-h-40 overflow-y-auto border p-2 rounded bg-gray-50">
                                            {existingMeasures.map((item, i) => (
                                                <div key={item.id} className="flex gap-2 items-center">
                                                    <input className="flex-1 border rounded px-2 py-1 text-sm text-gray-700" value={item.noi_dung} onChange={(e) => handleUpdateLocal('measure', i, e.target.value)} />
                                                    <button onClick={() => handleDeleteDetail('dm_bien_phap', item.id)} className="text-red-500 hover:bg-red-100 p-1 rounded"><UI_Icons.Trash2 size={16}/></button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                    <textarea className="w-full border rounded p-2 focus:ring-2 focus:ring-blue-200 outline-none" rows="2" placeholder="Nhập biện pháp mới (xuống dòng để tách ý)..." value={measure} onChange={e => setMeasure(e.target.value)}></textarea>
                                </div>
                            </>
                        )}
                    </div>

                    <div className="p-4 border-t flex justify-end gap-2 bg-gray-50 rounded-b-lg">
                        <button onClick={onClose} className="px-4 py-2 border rounded hover:bg-gray-200 transition-colors">Đóng</button>
                        {mode !== 'list' && (
                            <button onClick={handleSave} disabled={loading} className="px-6 py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700 shadow-md transition-all active:scale-95 flex items-center gap-2">
                                {loading ? <div className="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div> : <UI_Icons.Save size={18}/>}
                                Lưu Lại
                            </button>
                        )}
                    </div>
                </div>
            </div>
        );
    };

    const RiskSelectModal = ({ isOpen, onClose, title, options, selectedValues, onSave }) => {
        const [items, setItems] = useState([]);
        useEffect(() => { if (isOpen) setItems(selectedValues ? selectedValues.split(';').map(x => x.trim()).filter(x => x !== '') : []); }, [isOpen, selectedValues]);
        const toggleOption = (val) => setItems(prev => prev.includes(val) ? prev.filter(i => i !== val) : [...prev, val]);
        const handleSave = () => { onSave(items.join('; ')); onClose(); };
        if (!isOpen) return null;
        return (
            <div className="fixed inset-0 bg-black/50 z-[120] flex items-center justify-center p-4" onClick={onClose}>
                <div className="bg-white rounded-lg shadow-xl w-full max-w-lg flex flex-col max-h-[90vh]" onClick={e => e.stopPropagation()}>
                    <div className="p-4 border-b bg-blue-50 flex justify-between items-center"><h3 className="font-bold text-blue-800">{title}</h3><button onClick={onClose}><UI_Icons.X/></button></div>
                    <div className="p-4 overflow-y-auto flex-1 space-y-2">
                        <div className="mb-2"><div className="font-bold text-sm mb-1">Đã chọn:</div>{items.map((it, i) => (<div key={i} className="flex gap-2 mb-1"><textarea className="flex-1 border rounded p-1 text-sm" rows="1" value={it} onChange={e => { const n = [...items]; n[i] = e.target.value; setItems(n); }} /><button onClick={() => setItems(items.filter((_, idx) => idx !== i))} className="text-red-500"><UI_Icons.Trash2 size={16}/></button></div>))}</div>
                        <button onClick={() => setItems([...items, ""])} className="text-sm text-blue-600 font-bold flex items-center gap-1"><UI_Icons.Plus size={14}/> Thêm dòng</button>
                        <hr className="my-2"/>
                        <div className="font-bold text-sm mb-1">Gợi ý:</div>
                        <div className="space-y-1">{options.map((opt, i) => (<label key={i} className="flex gap-2 p-2 hover:bg-gray-100 rounded cursor-pointer"><input type="checkbox" checked={items.includes(opt.noi_dung)} onChange={() => toggleOption(opt.noi_dung)} /><span className="text-sm">{opt.noi_dung}</span></label>))}</div>
                    </div>
                    <div className="p-3 border-t flex justify-end gap-2"><button onClick={onClose} className="px-4 py-2 border rounded">Hủy</button><button onClick={handleSave} className="px-4 py-2 bg-blue-600 text-white rounded font-bold">Lưu</button></div>
                </div>
            </div>
        );
    };

    // --- COMPONENT QUẢN LÝ MẪU (V2 - CÓ CHỨC NĂNG SỬA TRỰC TIẾP) ---
    const TemplateManagerModal = ({ isOpen, onClose, onRefresh }) => {
        const [activeTab, setActiveTab] = useState('noi_dung');
        const [items, setItems] = useState([]);
        const [newItem, setNewItem] = useState("");
        const [loading, setLoading] = useState(false);

        // State cho chức năng sửa (Edit)
        const [editingId, setEditingId] = useState(null); // ID của dòng đang sửa
        const [editValue, setEditValue] = useState("");   // Nội dung đang sửa

        // Tải dữ liệu
        const fetchItems = async () => {
            setLoading(true);
            const { data, error } = await supabase
                .from('dm_mau_cong_viec')
                .select('*')
                .eq('loai', activeTab)
                .order('id', { ascending: true });
            
            if (!error) setItems(data || []);
            setLoading(false);
        };

        useEffect(() => {
            if (isOpen) {
                fetchItems();
                setEditingId(null); // Reset trạng thái sửa khi mở lại
            }
        }, [isOpen, activeTab]);

        // --- XỬ LÝ THÊM MỚI ---
        const handleAdd = async () => {
            if (!newItem.trim()) return;
            const { error } = await supabase.from('dm_mau_cong_viec').insert([{ loai: activeTab, noi_dung: newItem.trim() }]);
            if (error) alert("Lỗi thêm: " + error.message);
            else { setNewItem(""); fetchItems(); onRefresh(); }
        };

        // --- XỬ LÝ XÓA ---
        const handleDelete = async (id) => {
            if (!confirm("Xóa dòng mẫu này?")) return;
            const { error } = await supabase.from('dm_mau_cong_viec').delete().eq('id', id);
            if (error) alert("Lỗi xóa: " + error.message);
            else { fetchItems(); onRefresh(); }
        };

        // --- CÁC HÀM XỬ LÝ SỬA (EDIT) ---
        const startEdit = (item) => {
            setEditingId(item.id);
            setEditValue(item.noi_dung);
        };

        const cancelEdit = () => {
            setEditingId(null);
            setEditValue("");
        };

        const saveEdit = async (id) => {
            if (!editValue.trim()) return; // Không cho lưu rỗng
            
            const { error } = await supabase
                .from('dm_mau_cong_viec')
                .update({ noi_dung: editValue.trim() })
                .eq('id', id);

            if (error) {
                alert("Lỗi cập nhật: " + error.message);
            } else {
                setEditingId(null); // Thoát chế độ sửa
                fetchItems();       // Tải lại list trong modal
                onRefresh();        // Tải lại list ngoài App
            }
        };

        if (!isOpen) return null;

        return (
            <div className="fixed inset-0 bg-black/50 z-[160] flex items-center justify-center p-4" onClick={onClose}>
                <div className="bg-white rounded-lg shadow-xl w-full max-w-md flex flex-col max-h-[80vh]" onClick={e => e.stopPropagation()}>
                    <div className="p-3 border-b bg-purple-600 text-white rounded-t-lg flex justify-between items-center">
                        <h3 className="font-bold flex items-center gap-2"><UI_Icons.Edit size={18}/> Quản Lý Mẫu Nhập Liệu</h3>
                        <button onClick={onClose}><UI_Icons.X size={20}/></button>
                    </div>
                    
                    <div className="p-3 flex gap-2 bg-gray-50 border-b">
                        <button onClick={() => setActiveTab('noi_dung')} className={`flex-1 py-1.5 text-sm font-bold rounded ${activeTab === 'noi_dung' ? 'bg-purple-100 text-purple-700 border border-purple-300' : 'bg-white border text-gray-500 hover:bg-gray-100'}`}>Mục 5. Nội dung</button>
                        <button onClick={() => setActiveTab('pham_vi')} className={`flex-1 py-1.5 text-sm font-bold rounded ${activeTab === 'pham_vi' ? 'bg-purple-100 text-purple-700 border border-purple-300' : 'bg-white border text-gray-500 hover:bg-gray-100'}`}>Mục 6. Phạm vi</button>
                    </div>

                    <div className="p-4 overflow-y-auto flex-1 space-y-2">
                        {loading ? <div className="text-center text-gray-400 text-sm">Đang tải...</div> : (
                            items.length === 0 ? <div className="text-center text-gray-400 italic text-sm">Chưa có dữ liệu mẫu</div> : 
                            items.map(item => (
                                <div key={item.id} className={`flex justify-between items-center p-2 border rounded ${editingId === item.id ? 'bg-yellow-50 border-yellow-300' : 'bg-white hover:bg-gray-50'} group transition-colors`}>
                                    
                                    {/* --- CHẾ ĐỘ SỬA --- */}
                                    {editingId === item.id ? (
                                        <div className="flex w-full gap-2 items-center">
                                            <input 
                                                className="flex-1 border border-blue-300 rounded px-2 py-1 text-sm outline-none focus:ring-1 focus:ring-blue-500 bg-white"
                                                value={editValue}
                                                onChange={e => setEditValue(e.target.value)}
                                                onKeyDown={e => {
                                                    if(e.key === 'Enter') saveEdit(item.id);
                                                    if(e.key === 'Escape') cancelEdit();
                                                }}
                                                autoFocus
                                            />
                                            <button onClick={() => saveEdit(item.id)} className="text-green-600 hover:bg-green-100 p-1 rounded" title="Lưu lại"><UI_Icons.Save size={16}/></button>
                                            <button onClick={cancelEdit} className="text-gray-500 hover:bg-gray-200 p-1 rounded" title="Hủy bỏ"><UI_Icons.X size={16}/></button>
                                        </div>
                                    ) : (
                                    /* --- CHẾ ĐỘ XEM --- */
                                        <>
                                            <span className="text-sm font-medium text-gray-700 cursor-pointer flex-1" onClick={() => startEdit(item)}>{item.noi_dung}</span>
                                            <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                                <button onClick={() => startEdit(item)} className="text-blue-500 hover:bg-blue-100 p-1.5 rounded" title="Sửa dòng này"><UI_Icons.Edit size={14}/></button>
                                                <button onClick={() => handleDelete(item.id)} className="text-red-400 hover:bg-red-100 p-1.5 rounded" title="Xóa dòng này"><UI_Icons.Trash2 size={14}/></button>
                                            </div>
                                        </>
                                    )}
                                </div>
                            ))
                        )}
                    </div>

                    <div className="p-3 border-t bg-gray-50 rounded-b-lg">
                        <div className="flex gap-2">
                            <input 
                                className="flex-1 border rounded px-2 py-1.5 text-sm outline-none focus:border-purple-500" 
                                placeholder="Nhập nội dung mẫu mới..." 
                                value={newItem} 
                                onChange={e => setNewItem(e.target.value)}
                                onKeyDown={e => e.key === 'Enter' && handleAdd()}
                            />
                            <button onClick={handleAdd} className="bg-purple-600 text-white px-3 py-1.5 rounded font-bold text-sm hover:bg-purple-700 shadow-sm flex items-center gap-1">
                                <UI_Icons.Plus size={16}/> Thêm
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        );
    };


// --- COMPONENT TRANG QUẢN LÝ BÁO CÁO (ĐÃ CẬP NHẬT NÚT ĐĂNG XUẤT) ---
    const ReportListPage = ({ isOpen, onCreateNew, onLoad, onExport, onZoom, onLogout, currentUser }) => {
        const [reports, setReports] = useState([]);
        const [loading, setLoading] = useState(false);
        const [filterDate, setFilterDate] = useState(""); 
        const [filterCode, setFilterCode] = useState("");
        const [downloadedIds, setDownloadedIds] = useState([]);
        const [previewImages, setPreviewImages] = useState(null);

        useEffect(() => {
            const updateDownloadedStatus = () => {
                const downloaded = JSON.parse(localStorage.getItem('downloaded_reports') || '[]');
                setDownloadedIds(downloaded);
            };
            if (isOpen) {
                document.body.style.overflow = 'hidden'; 
                fetchReports();
                updateDownloadedStatus();
                window.addEventListener('storage', updateDownloadedStatus);
            } else {
                document.body.style.overflow = '';
            }
            return () => { document.body.style.overflow = ''; window.removeEventListener('storage', updateDownloadedStatus); }
        }, [isOpen]);

        const fetchReports = async (searchCode = filterCode, searchDate = filterDate) => {
            setLoading(true);
            try {
                // Sắp xếp ưu tiên ngày thực hiện mới nhất lên đầu
                let query = supabase
                    .from('bien_ban_khao_sat')
                    .select('*')
                    .order('ngay_thuc_hien', { ascending: false, nullsFirst: false }) 
                    .order('created_at', { ascending: false }); // Dự phòng nếu ngày thực hiện bị trống
                if (searchCode && searchCode.trim()) query = query.ilike('ma_tru', `%${searchCode.trim()}%`);
                if (searchDate) {
                    const startDate = new Date(searchDate); startDate.setHours(0, 0, 0, 0);
                    const endDate = new Date(searchDate); endDate.setHours(23, 59, 59, 999);
                    query = query.gte('created_at', startDate.toISOString()).lte('created_at', endDate.toISOString());
                }
                const { data, error } = await query;
                if (error) throw error;
                setReports(data || []);
            } catch (error) { alert("Lỗi tải danh sách: " + error.message); } finally { setLoading(false); }
        };

        const handleClearFilters = () => { setFilterCode(""); setFilterDate(""); fetchReports("", ""); };
        
        const handleDelete = async (id, e) => {
            e.stopPropagation();
            if(!confirm("Bạn có chắc muốn xóa biên bản này vĩnh viễn?")) return;
            const { error } = await supabase.from('bien_ban_khao_sat').delete().eq('id', id);
            if (error) alert("Lỗi xóa: " + error.message); else fetchReports();
        };

        const handleEditClick = (id) => { onLoad(id); };
        
        const handleExportClick = (report) => { 
            if (onExport) {
                onExport(report);
                if (!downloadedIds.includes(report.id)) {
                    setDownloadedIds([...downloadedIds, report.id]);
                }
            }
        };
        
        const formatDateTime = (isoString) => {
            if (!isoString) return "";
            const date = new Date(isoString);
            const d = date.getDate().toString().padStart(2, '0');
            const m = (date.getMonth() + 1).toString().padStart(2, '0');
            const y = date.getFullYear();
            const h = date.getHours().toString().padStart(2, '0');
            const min = date.getMinutes().toString().padStart(2, '0');
            return `${d}/${m}/${y} - ${h}:${min}`;
        };

        if (!isOpen) return null;

        return (
            <div className="fixed inset-0 bg-gray-100 z-[9999] flex flex-col overflow-hidden" style={{ margin: 0, padding: 0 }}>
                {/* MODAL XEM ẢNH TRONG LIST */}
                <ImageGalleryModal images={previewImages} onClose={() => setPreviewImages(null)} onZoom={onZoom} />

                {/* HEADER (ĐÃ SỬA: THÊM NÚT ĐĂNG XUẤT) */}
                <div className="bg-white border-b px-3 py-2 shadow-sm flex items-center justify-between shrink-0 h-14 relative z-20">
                    <div className="flex items-center gap-2">
                        <h2 className="text-base font-bold text-blue-800 uppercase flex items-center gap-1">
                            <UI_Icons.NotebookPen size={18} /> KHẢO SÁT HIỆN TRƯỜNG
                        </h2>
                    </div>
                    
                    <div className="flex items-center gap-2">
                        {/* Hiển thị tên user trên màn hình lớn */}
                        <span className="text-xs font-bold text-gray-500 hidden sm:block mr-1">Hi, {currentUser}</span>
                        
                        {/* NÚT ĐĂNG XUẤT MỚI */}
                        <button onClick={onLogout} className="bg-gray-100 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-full transition-colors border border-gray-200 font-bold text-xs flex items-center gap-1">
                            Thoát
                        </button>

                        <button onClick={onCreateNew} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-full transition-colors shadow-md font-bold flex items-center gap-2 text-sm">
                            <UI_Icons.Plus size={18} strokeWidth={3} /> Tạo Mới
                        </button>
                    </div>
                </div>

                {/* FILTER BAR */}
                <div className="bg-white p-2 border-b shrink-0 z-10 shadow-sm">
                    <div className="max-w-4xl mx-auto flex gap-2 items-center">
                        <div className="flex-1 relative">
                            <input type="text" className="w-full border border-gray-300 rounded pl-8 pr-2 py-1.5 outline-none focus:border-blue-500 font-bold text-gray-700 text-sm" placeholder="Tìm số trụ..." value={filterCode} onChange={(e) => setFilterCode(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && fetchReports()} />
                            <div className="absolute left-2.5 top-2 text-gray-400"><UI_Icons.ZoomIn size={16}/></div>
                        </div>
                        <input type="date" className="border border-gray-300 rounded px-2 py-1.5 outline-none font-medium text-sm w-32" value={filterDate} onChange={(e) => setFilterDate(e.target.value)} />
                        <button onClick={() => fetchReports()} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 px-3 rounded shadow text-sm">Tìm</button>
                        {(filterDate || filterCode) && (<button onClick={handleClearFilters} className="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-1.5 px-3 rounded" title="Hủy lọc"><UI_Icons.RotateCcw size={16}/></button>)}
                    </div>
                </div>

                {/* DANH SÁCH */}
                <div className="flex-1 overflow-y-auto bg-gray-100 p-2">
                    <div className="max-w-4xl mx-auto pb-20">
                        {loading ? (
                            <div className="text-center py-8 text-gray-500 text-sm flex flex-col items-center gap-2"><div className="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600"></div> Đang tải...</div>
                        ) : reports.length === 0 ? (
                            <div className="text-center py-10 bg-white rounded border border-gray-200 text-gray-400 italic text-sm">Chưa có biên bản nào. Bấm "Tạo Mới" để bắt đầu.</div>
                        ) : (
                            <div className="bg-white rounded border border-gray-200 overflow-hidden shadow-sm">
                                <div className="divide-y divide-gray-100">
                                    {reports.map(r => {
                                        const isDownloaded = downloadedIds.includes(r.id);
                                        const btnClass = isDownloaded ? "bg-green-100 text-green-700 border-green-200 hover:bg-green-200" : "bg-white text-gray-700 border-gray-300 hover:bg-gray-100 hover:text-green-700 hover:border-green-300";
                                        const imgCount = r.du_lieu_form?.hinh_anh ? r.du_lieu_form.hinh_anh.length : 0;
                                        return (
                                            <div key={r.id} className="px-3 py-2.5 hover:bg-blue-50 transition-colors group cursor-default">
                                                <div className="flex items-center justify-between gap-2">
                                                    <div className="flex-1 min-w-0 flex flex-col justify-center">
                                                        {/* DÒNG 1: ĐỊA ĐIỂM ĐẦY ĐỦ (Lấy từ cột ma_tru) */}
                                                        <div className="font-bold text-blue-800 text-base leading-tight mb-1 truncate" title={r.ma_tru}>
                                                            {r.ma_tru || "---"}
                                                        </div>
                                                        
                                                        {/* DÒNG 2: NGÀY THỰC HIỆN | NỘI DUNG CÔNG VIỆC */}
                                                        <div className="flex items-center text-sm text-gray-600 gap-2">
                                                            {/* Phần 1: Ngày thực hiện (Đưa lên trước) */}
                                                            <span className="font-medium text-gray-700 whitespace-nowrap shrink-0">
                                                                {r.ngay_thuc_hien 
                                                                    ? r.ngay_thuc_hien.split('-').reverse().join('/') 
                                                                    : formatDateTime(r.created_at)}
                                                            </span>

                                                            {/* Phần 2: Dấu gạch đứng */}
                                                            <span className="text-gray-300">|</span>

                                                            {/* Phần 3: Nội dung công việc (Lấy từ cột ten_tuyen) */}
                                                            <span className="truncate" title={r.ten_tuyen}>
                                                                {r.ten_tuyen || "(Chưa có nội dung)"}
                                                            </span>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-1 shrink-0 self-center">
                                                        {imgCount > 0 ? (
                                                            <button onClick={() => setPreviewImages(r.du_lieu_form.hinh_anh)} className="flex items-center gap-1 px-2 py-1.5 bg-purple-50 text-purple-700 hover:bg-purple-100 border border-purple-200 rounded text-[11px] font-bold active:scale-95 transition-transform shadow-sm" title="Xem ảnh hiện trường"><UI_Icons.Image size={14}/> {imgCount}</button>
                                                        ) : (<button className="p-1.5 text-gray-300 cursor-not-allowed" title="Không có ảnh"><UI_Icons.Image size={16}/></button>)}
                                                        <button onClick={() => handleEditClick(r.id)} className="flex items-center gap-1 px-2.5 py-1.5 bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200 rounded text-[11px] font-bold active:scale-95 transition-transform shadow-sm"><UI_Icons.Edit size={14}/> Sửa</button>
                                                        <button onClick={() => handleExportClick(r)} className={`flex items-center gap-1 px-2.5 py-1.5 border rounded text-[11px] font-bold active:scale-95 transition-all shadow-sm ${btnClass}`}><UI_Icons.Download size={14}/> Word</button>
                                                        <button onClick={(e) => handleDelete(r.id, e)} className="p-1.5 text-gray-300 hover:text-red-500 hover:bg-red-50 rounded ml-1 transition-colors active:scale-95"><UI_Icons.Trash2 size={18}/></button>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            </div>
        );
    };

    const App = () => {

// --- CHÈN ĐOẠN NÀY VÀO ĐẦU TIÊN TRONG App ---
        const [isAuthenticated, setIsAuthenticated] = useState(false);
        const [isCheckingAuth, setIsCheckingAuth] = useState(false);
        const [currentUser, setCurrentUser] = useState(null);

        // Tự động đăng nhập nếu đã lưu phiên trước đó
        useEffect(() => {
            const savedUser = localStorage.getItem('bskht_user');
            if (savedUser) { setIsAuthenticated(true); setCurrentUser(savedUser); }
        }, []);

        // Hàm xử lý đăng nhập
        const handleLogin = async (username, password) => {
            if(!username || !password) return alert("Vui lòng nhập đủ thông tin!");
            setIsCheckingAuth(true);
            try {
                const { data, error } = await supabase.from('app_users').select('*').eq('username', username).eq('password', password).single();
                if (error || !data) {
                    alert("Sai tên đăng nhập hoặc mật khẩu!");
                } else {
                    localStorage.setItem('bskht_user', data.full_name || username);
                    setCurrentUser(data.full_name || username);
                    setIsAuthenticated(true);
                }
            } catch (e) { alert("Lỗi kết nối: " + e.message); }
            setIsCheckingAuth(false);
        };

        // Hàm đăng xuất
        const handleLogout = () => {
            if(confirm("Đăng xuất khỏi tài khoản?")) {
                localStorage.removeItem('bskht_user');
                setIsAuthenticated(false);
                setCurrentUser(null);
            }
        };


        // --- 1. CÁC HÀM TIỆN ÍCH (DATE HELPER) ---
        // Lấy ngày hôm nay chuẩn ISO (yyyy-mm-dd) cho input type="date"
