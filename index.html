      const handleSaveCloud = async () => {
            if (!confirm("Bạn có đồng ý lưu biên bản này và thoát ra màn hình chính không?")) return;
            
            // Kiểm tra dữ liệu bắt buộc
            if (!formData.loc_poleCode) { 
                alert("Vui lòng nhập Mã trụ trước khi lưu!"); 
                return;
            }

            // --- 1. TẠO CHUỖI ĐỊA ĐIỂM ĐẦY ĐỦ (Dùng làm ma_tru) ---
            const truStart = formData.loc_poleCode || "...";
            const subStart = formData.loc_subCode ? "/" + formData.loc_subCode : "";
            const tuyen = formData.loc_lineName || "...";
            
            let fullLocation = "";
            if (formData.is_range) {
                // Chế độ Từ... Đến...
                const truEnd = formData.loc_poleCode_to || "...";
                const subEnd = formData.loc_subCode_to ? "/" + formData.loc_subCode_to : "";
                fullLocation = `Từ trụ ${truStart}${subStart} đến trụ ${truEnd}${subEnd} tuyến ${tuyen}`;
            } else {
                // Chế độ Tại...
                fullLocation = `Tại trụ ${truStart}${subStart} tuyến ${tuyen}`;
            }

            // --- 2. KHAI BÁO PAYLOAD (Đây là phần bạn bị thiếu/lỗi) ---
            const payload = { 
                ma_tru: fullLocation,               // Lưu địa điểm hiển thị vào cột mã trụ
                ten_tuyen: formData.muc5_noiDung,   // Lưu nội dung công việc vào cột tên tuyến
                du_lieu_form: formData,             // Lưu toàn bộ dữ liệu gốc
                du_lieu_so_do: diagramData,         // Lưu sơ đồ
                updated_at: new Date().toISOString(),
                ngay_thuc_hien: formData.muc7_ngay  // Lưu ngày thực hiện để sắp xếp
            };
            
            // --- 3. GỌI SUPABASE ---
            let error;
            if (currentReportId) { 
                // Nếu đang sửa -> Update
                const res = await supabase.from('bien_ban_khao_sat').update(payload).eq('id', currentReportId); 
                error = res.error; 
            } else { 
                // Nếu tạo mới -> Insert
                const res = await supabase.from('bien_ban_khao_sat').insert([payload]).select(); 
                error = res.error; 
            }
            
            // --- 4. XỬ LÝ KẾT QUẢ ---
            if (error) {
                alert("Lỗi khi lưu: " + error.message);
            } else { 
                alert("Đã lưu thành công!"); 
                setShowReportList(true); 
            }
        };

        const handleLoadReport = async (id) => {
            const { data, error } = await supabase.from('bien_ban_khao_sat').select('*').eq('id', id).single();
            if (error) { alert("Lỗi tải biên bản: " + error.message); } 
            else if (data) { 
                const savedForm = data.du_lieu_form || {};
                setFormData({ 
                    ...DEFAULT_FORM_DATA, 
                    ...savedForm,
                    phieu_dgrr_ngay: savedForm.phieu_dgrr_ngay || getTodayISO(),
                    muc7_ngay: savedForm.muc7_ngay || getTodayISO()
                }); 
                setDiagramData(data.du_lieu_so_do || []); 
                setCurrentReportId(data.id); 
                setShowReportList(false); 
            }
        };

        const handleCreateNew = () => {
            // Reset sạch sẽ về mặc định
            setFormData({ ...DEFAULT_FORM_DATA, phieu_dgrr_ngay: getTodayISO(), muc7_ngay: getTodayISO() });
            setDiagramData([]); setCurrentReportId(null); setShowReportList(false);
        };

        // --- XỬ LÝ ẢNH (Upload lên Supabase) ---
        const handleImageUpload = async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            // KIỂM TRA BUCKET TRƯỚC KHI UPLOAD
            // Lưu ý: Người dùng phải tạo bucket 'survey_images' public trong Supabase Dashboard
            const bucketName = 'survey_images';
            
            // Upload từng ảnh
            const uploadPromises = files.map(async (file) => {
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
                const filePath = `${fileName}`;

                try {
                    const { data, error } = await supabase.storage.from(bucketName).upload(filePath, file);
                    
                    if (error) {
                        console.error("Upload lỗi:", error);
                        if (error.message.includes("Bucket not found")) {
                            alert("Chưa tạo Bucket! Hãy vào Supabase > Storage > Tạo bucket tên 'survey_images' và set Public.");
                        } else if (error.message.includes("policy")) {
                            alert("Lỗi quyền truy cập! Hãy vào Supabase > Storage > Policies > Tạo policy cho phép INSERT public.");
                        }
                        return null;
                    }

                    // Lấy URL public
                    const { data: publicUrlData } = supabase.storage.from(bucketName).getPublicUrl(filePath);
                    return publicUrlData.publicUrl;
                } catch (err) {
                    console.error("Lỗi hệ thống upload:", err);
                    return null;
                }
            });

            // Chờ tất cả ảnh upload xong
            const uploadedUrls = (await Promise.all(uploadPromises)).filter(url => url !== null);
            
            // Cập nhật state
            setFormData(prev => ({
                ...prev,
                hinh_anh: [...(prev.hinh_anh || []), ...uploadedUrls]
            }));
        };

// --- HÀM XÓA ẢNH (ĐÃ SỬA: XÓA CẢ TRÊN CLOUD) ---
        const removeImage = async (index) => {
            const urlToDelete = formData.hinh_anh[index];
            
            // 1. Xác nhận trước khi xóa (tránh bấm nhầm)
            if(!confirm("Bạn chắc chắn muốn xóa ảnh này?")) return;

            // 2. Xóa khỏi giao diện ngay lập tức
            const newImages = [...(formData.hinh_anh || [])];
            newImages.splice(index, 1);
            setFormData({ ...formData, hinh_anh: newImages });

            // 3. Xóa file trên Supabase Storage (Chạy ngầm)
            if (urlToDelete) {
                try {
                    // URL thường có dạng: .../public/survey_images/filename.jpg
                    // Ta cần lấy phần: filename.jpg
                    const bucketName = 'survey_images';
                    const parts = urlToDelete.split(`${bucketName}/`);
                    
                    if (parts.length > 1) {
                        const filePath = parts.pop(); // Lấy phần cuối cùng
                        await supabase.storage.from(bucketName).remove([filePath]);
                        console.log("Đã xóa file trên cloud:", filePath);
                    }
                } catch (err) {
                    console.error("Lỗi xóa file cloud:", err);
                }
            }
        };

        const handleRiskTypeChange = (listKey, index, e) => {
            const riskId = parseInt(e.target.value); const riskObj = riskLibrary.risks.find(r => r.id === riskId); const newRisks = [...formData[listKey]];
            newRisks[index] = { ...newRisks[index], riskId: riskId, moiNguy: riskObj ? riskObj.ten_moi_nguy : "", bac: riskObj ? riskObj.bac_rr_mac_dinh : "", moTa: "", bienPhap: "" };
            setFormData({ ...formData, [listKey]: newRisks });
        };
        const openRiskModal = (listKey, index, field) => { const currentRow = formData[listKey][index]; const riskId = currentRow.riskId; if (!riskId) { alert("Vui lòng chọn 'Nhận diện mối nguy' trước."); return; } let options = field === 'moTa' ? riskLibrary.descriptions.filter(d => d.moi_nguy_id === riskId) : riskLibrary.measures.filter(m => m.moi_nguy_id === riskId); setModalConfig({ isOpen: true, rowIndex: index, type: field, listType: listKey, options: options, title: field === 'moTa' ? `Mô tả: ${currentRow.moiNguy}` : `Biện pháp: ${currentRow.moiNguy}`, currentValue: currentRow[field] }); };
        const saveModalSelection = (value) => { const { listType, rowIndex, type } = modalConfig; const newRisks = [...formData[listType]]; newRisks[rowIndex][type] = value; setFormData({ ...formData, [listType]: newRisks }); };
        const updateRiskRowManual = (listKey, index, field, value) => { const newRisks = [...formData[listKey]]; newRisks[index][field] = value; setFormData({ ...formData, [listKey]: newRisks }); };
        const addRiskRow = (type) => { const listKey = type === 'ATLD' ? 'ruiRo_ATLD' : 'ruiRo_VSLD'; setFormData({ ...formData, [listKey]: [...formData[listKey], { riskId: "", moiNguy: "", moTa: "", bac: "", bienPhap: "" }] }); };
        const removeRiskRow = (type, index) => { const listKey = type === 'ATLD' ? 'ruiRo_ATLD' : 'ruiRo_VSLD'; const newRisks = formData[listKey].filter((_, i) => i !== index); setFormData({...formData, [listKey]: newRisks}); };

// Nếu chưa đăng nhập thì hiện màn hình Login
        if (!isAuthenticated) return <LoginScreen onLogin={handleLogin} loading={isCheckingAuth} />;

        return (
            <div className="pb-20">
                {/* --- MODAL PHÓNG TO ẢNH (MỚI - TOÀN MÀN HÌNH ĐEN) --- */}
                {zoomImage && (
                    <div className="fixed inset-0 z-[99999] bg-black flex flex-col items-center justify-center animate-zoom-in" onClick={() => setZoomImage(null)}>
                        {/* Toolbar trên cùng */}
                        <div className="absolute top-0 left-0 right-0 p-4 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent z-[99999] text-white">
                            <span className="text-sm font-medium opacity-70">Chạm vào nền để đóng</span>
                            <div className="flex gap-4">
                                <a href={zoomImage} target="_blank" className="flex items-center gap-1 font-bold text-blue-300 hover:text-white border border-blue-300 rounded px-3 py-1.5 text-xs bg-black/50 backdrop-blur-md" onClick={(e) => e.stopPropagation()}>
                                    <UI_Icons.Share2 size={16}/> Mở Ảnh Gốc (Zoom nét)
                                </a>
                                <button onClick={() => setZoomImage(null)} className="bg-white/20 rounded-full p-2 hover:bg-red-500 transition-colors backdrop-blur-md"><UI_Icons.X size={24}/></button>
                            </div>
                        </div>
                        
                        {/* Ảnh hiển thị full không padding, giữ nguyên tỉ lệ */}
                        <div className="w-full h-full flex items-center justify-center p-0 m-0 overflow-hidden">
                            <img 
                                src={zoomImage} 
                                className="max-w-full max-h-full object-contain" 
                                alt="Zoom View" 
                                onClick={(e) => e.stopPropagation()} // Bấm vào ảnh ko bị đóng
                            />
                        </div>
                    </div>
                )}

                {showDiagram && <DiagramEditor initialData={diagramData} onSave={(data) => setDiagramData(data)} onClose={() => setShowDiagram(false)} />}
                <RiskSelectModal isOpen={modalConfig.isOpen} onClose={() => setModalConfig({...modalConfig, isOpen: false})} title={modalConfig.title} options={modalConfig.options} selectedValues={modalConfig.currentValue} onSave={saveModalSelection} />
                {/* Đã thêm onLogout và currentUser vào đây */}
                <ReportListPage 
                    isOpen={showReportList} 
                    onCreateNew={handleCreateNew} 
                    onLoad={handleLoadReport} 
                    onExport={handleExportDocx} 
                    onZoom={(url) => setZoomImage(url)} 
                    onLogout={handleLogout}      // <--- Mới
                    currentUser={currentUser}    // <--- Mới
                />
                <RiskManagerModal isOpen={showRiskManager} onClose={() => setShowRiskManager(false)} onRefresh={fetchRiskLibrary} existingRisks={riskLibrary.risks} />

                {/* Modal Quản lý Mẫu công việc */}
                <TemplateManagerModal 
                    isOpen={showTemplateManager} 
                    onClose={() => setShowTemplateManager(false)} 
                    onRefresh={fetchWorkTemplates} 
                />

                <div className="fixed bottom-0 left-0 right-0 bg-white border-t p-3 flex justify-between items-center z-40 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
                    <div className="text-xs text-gray-500 font-medium">{currentReportId ? <span className="text-blue-600 font-bold">Đang sửa: {formData.loc_poleCode}</span> : "Đang tạo mới"}</div>
                    <div className="flex gap-2">
                        <button 
                            onClick={async () => { 
                                if(confirm("Dữ liệu chưa lưu sẽ mất. Bạn chắc chắn muốn thoát?")) {
                                    // NẾU ĐANG TẠO MỚI (Chưa có ID) -> Xóa sạch ảnh vừa up để tránh rác
                                    if (!currentReportId && formData.hinh_anh.length > 0) {
                                        const bucketName = 'survey_images';
                                        const pathsToDelete = formData.hinh_anh.map(url => url.split(`${bucketName}/`).pop());
                                        await supabase.storage.from(bucketName).remove(pathsToDelete);
                                        console.log("Đã dọn dẹp ảnh rác do hủy tạo mới");
                                    }
                                    setShowReportList(true); 
                                }
                            }} 
                            className="bg-gray-100 text-gray-600 px-3 py-2 rounded-lg font-bold flex items-center gap-2 hover:bg-gray-200 border border-gray-300 text-xs md:text-sm"
                        >
                            Hủy/Thoát
                        </button>

                        {/* --- NÚT QUẢN LÝ MẪU MỚI --- */}
                        <button 
                            onClick={() => setShowTemplateManager(true)} 
                            className="bg-purple-100 text-purple-700 px-3 py-2 rounded-lg font-bold flex items-center gap-2 hover:bg-purple-200 border border-purple-300" 
                            title="Chỉnh sửa list Nội dung & Phạm vi"
                        >
                            <UI_Icons.Edit size={18}/> <span className="hidden md:inline">List Mẫu</span>
                        </button>

                        <button onClick={() => setShowRiskManager(true)} className="bg-orange-100 text-orange-700 px-3 py-2 rounded-lg font-bold flex items-center gap-2 hover:bg-orange-200 border border-orange-300" title="Quản lý Mối Nguy"><UI_Icons.Plus size={18}/> <span className="hidden md:inline">Mối Nguy</span></button>
                        <button onClick={handleSaveCloud} className="bg-green-600 text-white px-4 py-2 rounded-lg font-bold flex items-center gap-2 hover:bg-green-700 active:scale-95 transition-all shadow-md"><UI_Icons.Save size={18}/> Lưu & Thoát</button>
                        <button onClick={() => handleExportDocx(null)} className="bg-blue-600 text-white px-3 py-2 rounded-lg font-bold flex items-center gap-2 hover:bg-blue-700 shadow-md"><UI_Icons.Download size={18}/></button>
                    </div>
                </div>

                <div className="a4-paper">
                    <div className="flex justify-between mb-6 text-center text-sm"><div className="w-1/2"><div className="font-bold uppercase">CÔNG TY ĐIỆN LỰC AN GIANG</div><input className="input-line text-center uppercase font-bold" value={formData.donVi} onChange={e => setFormData({...formData, donVi: e.target.value})} /><hr className="w-1/3 mx-auto mt-1 border-gray-400" /></div><div className="w-1/2"><div className="font-bold uppercase">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</div><div className="font-bold underline decoration-1 underline-offset-4">Độc lập - Tự do - Hạnh phúc</div><div className="mt-2 italic">Châu Phú, ngày <input type="number" className="w-8 text-center border-b border-gray-300 outline-none" value={formData.ngay} onChange={e => setFormData({...formData, ngay: e.target.value})} /> tháng <input type="number" className="w-8 text-center border-b border-gray-300 outline-none" value={formData.thang} onChange={e => setFormData({...formData, thang: e.target.value})} /> năm <input type="number" className="w-12 text-center border-b border-gray-300 outline-none" value={formData.nam} onChange={e => setFormData({...formData, nam: e.target.value})} /></div></div></div>
                    <h1 className="text-xl font-bold text-center mb-4 uppercase">BIÊN BẢN KHẢO SÁT HIỆN TRƯỜNG</h1>
                    <div className="mb-4 text-justify flex flex-wrap items-end gap-1 text-[15px] leading-7"><span>Vào hồi</span><div className="mx-1"><TimeSelect value={formData.gioKhaoSat} onChange={(val) => setFormData({...formData, gioKhaoSat: val})} /></div>
                    {/* --- NÚT CHUYỂN CHẾ ĐỘ --- */}
                    <button 
                        onClick={() => setFormData(prev => ({...prev, is_range: !prev.is_range}))}
                        className="mx-1 px-2 py-0.5 rounded text-[10px] font-bold border border-blue-500 text-blue-600 hover:bg-blue-50"
                        title="Bấm để chuyển đổi giữa 'Tại trụ' và 'Từ trụ...Đến trụ...'"
                    >
                        {formData.is_range ? "TỪ TRỤ... ĐẾN..." : "TẠI TRỤ..."}
                    </button>

                    {/* --- LOGIC HIỂN THỊ --- */}
                    {formData.is_range ? (
                        // GIAO DIỆN TỪ... ĐẾN...
                        <>
                            <span>từ trụ</span>
                            <input list="pole-list" className="border-b border-gray-300 font-bold bg-transparent outline-none w-[100px] text-center" value={formData.loc_poleCode} onChange={handlePoleChange} placeholder="Đầu" />
                            <span>/</span>
                            <input className="border-b border-gray-300 outline-none font-bold w-45 text-center" value={formData.loc_subCode} onChange={e => setFormData({...formData, loc_subCode: e.target.value})} placeholder="..." />
                            
                            <span>đến trụ</span>
                            <input list="pole-list" className="border-b border-gray-300 font-bold bg-transparent outline-none w-[100px] text-center" value={formData.loc_poleCode_to} onChange={e => setFormData({...formData, loc_poleCode_to: e.target.value})} placeholder="Cuối" />
                            <span>/</span>
                            <input className="border-b border-gray-300 outline-none font-bold w-45 text-center" value={formData.loc_subCode_to} onChange={e => setFormData({...formData, loc_subCode_to: e.target.value})} placeholder="..." />
                        </>
                    ) : (
                        // GIAO DIỆN TẠI TRỤ (CŨ)
                        <>
                            <span>tại trụ</span>
                            <input list="pole-list" className="border-b border-gray-300 font-bold bg-transparent outline-none w-[100px] text-center" value={formData.loc_poleCode} onChange={handlePoleChange} placeholder="Chọn/Nhập..." />
                            <span>/</span>
                            <input className="border-b border-gray-300 outline-none font-bold w-45 text-center" value={formData.loc_subCode} onChange={e => setFormData({...formData, loc_subCode: e.target.value})} placeholder="..." />
                        </>
                    )}

                    <span>tuyến</span>
                    {/* ... đoạn phía sau giữ nguyên ... */}
                    <input list="line-list" className="font-bold border-b border-gray-300 w-[180px] px-1 text-center text-blue-800 bg-transparent outline-none" value={formData.loc_lineName} onChange={e => setFormData({...formData, loc_lineName: e.target.value})} placeholder="..." /><span>, xã</span><select className="border-b border-gray-300 font-bold bg-transparent outline-none min-w-[90px]" value={formData.loc_commune} onChange={e => setFormData({...formData, loc_commune: e.target.value})}><option value="">Chọn xã</option>{dbCommunes.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}</select><span>, tỉnh An Giang.</span></div>
                    <div className="mb-2 font-bold">Chúng tôi gồm:</div>
                    <datalist id="pole-list">{dbPoles.map(p => <option key={p.code} value={p.code} />)}</datalist><datalist id="line-list">{[...new Set(dbPoles.map(p => p.line_name))].map((l, i) => <option key={i} value={l} />)}</datalist><datalist id="staff-list">{dbStaff.map((name, i) => <option key={i} value={name} />)}</datalist><datalist id="position-list">{dbPositions.map((pos, i) => <option key={i} value={pos} />)}</datalist><datalist id="unit-list">{dbUnits.map((u, i) => <option key={i} value={u} />)}</datalist>
                    <div className="mb-4 pl-4"><div className="font-bold">1. Đại diện Đơn vị công tác:</div><div className="grid grid-cols-1 md:grid-cols-2 gap-4 pl-4 mt-2"><div className="flex flex-col gap-1 border p-2 rounded bg-gray-50 border-dashed border-gray-300"><div className="flex gap-2 items-center"><span className="font-semibold text-sm">1.1 Ông (Bà):</span><input list="staff-list" className="input-line flex-grow font-bold text-blue-800" value={formData.dvct_daiDien1} onChange={e => setFormData({...formData, dvct_daiDien1: e.target.value})} placeholder="Nhập/Chọn tên..." /></div><div className="flex gap-2 items-center"><span className="text-sm">Chức vụ:</span><input list="position-list" className="input-line flex-grow bg-transparent" value={formData.dvct_chucVu1} onChange={e => setFormData({...formData, dvct_chucVu1: e.target.value})} placeholder="Chọn..." /></div></div><div className="flex flex-col gap-1 border p-2 rounded bg-gray-50 border-dashed border-gray-300"><div className="flex gap-2 items-center"><span className="font-semibold text-sm">1.2 Ông (Bà):</span><input list="staff-list" className="input-line flex-grow font-bold text-blue-800" value={formData.dvct_daiDien2} onChange={e => setFormData({...formData, dvct_daiDien2: e.target.value})} placeholder="Nhập/Chọn tên..." /></div><div className="flex gap-2 items-center"><span className="text-sm">Chức vụ:</span><input list="position-list" className="input-line flex-grow bg-transparent" value={formData.dvct_chucVu2} onChange={e => setFormData({...formData, dvct_chucVu2: e.target.value})} placeholder="Chọn..." /></div></div></div></div>
{/* --- MỤC 2: ĐẠI DIỆN QLVH (CẤU TRÚC GRID CŨ - THÊM 2.3) --- */}
                    <div className="mb-4 pl-4">
                        <div className="font-bold">2. Đại diện (các) Đơn vị QLVH:</div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pl-4 mt-2">
                            
                            {/* Ô 2.1 */}
                            <div className="flex flex-col gap-1 border p-2 rounded bg-gray-50 border-dashed border-gray-300">
                                <div className="flex gap-2 items-center"><span className="font-semibold text-sm">2.1 Ông (Bà):</span><input list="staff-list" className="input-line flex-grow font-bold text-blue-800" value={formData.qlvh_daiDien1} onChange={e => setFormData({...formData, qlvh_daiDien1: e.target.value})} placeholder="Nhập tên..." /></div>
                                <div className="flex gap-2"><div className="flex items-center w-1/2 gap-1"><span className="text-sm">Chức vụ:</span><input list="position-list" className="input-line bg-transparent" value={formData.qlvh_chucVu1} onChange={e => setFormData({...formData, qlvh_chucVu1: e.target.value})} /></div><div className="flex items-center w-1/2 gap-1"><span className="text-sm">Đơn vị:</span><input list="unit-list" className="input-line bg-transparent" value={formData.qlvh_donVi1} onChange={e => setFormData({...formData, qlvh_donVi1: e.target.value})} /></div></div>
                            </div>

                            {/* Ô 2.2 */}
                            <div className="flex flex-col gap-1 border p-2 rounded bg-gray-50 border-dashed border-gray-300">
                                <div className="flex gap-2 items-center"><span className="font-semibold text-sm">2.2 Ông (Bà):</span><input list="staff-list" className="input-line flex-grow font-bold text-blue-800" value={formData.qlvh_daiDien2} onChange={e => setFormData({...formData, qlvh_daiDien2: e.target.value})} placeholder="Nhập tên..." /></div>
                                <div className="flex gap-2"><div className="flex items-center w-1/2 gap-1"><span className="text-sm">Chức vụ:</span><input list="position-list" className="input-line bg-transparent" value={formData.qlvh_chucVu2} onChange={e => setFormData({...formData, qlvh_chucVu2: e.target.value})} /></div><div className="flex items-center w-1/2 gap-1"><span className="text-sm">Đơn vị:</span><input list="unit-list" className="input-line bg-transparent" value={formData.qlvh_donVi2} onChange={e => setFormData({...formData, qlvh_donVi2: e.target.value})} /></div></div>
                            </div>

                            {/* Ô 2.3 (MỚI THÊM VÀO GRID) */}
                            <div className="flex flex-col gap-1 border p-2 rounded bg-gray-50 border-dashed border-gray-300">
                                <div className="flex gap-2 items-center"><span className="font-semibold text-sm">2.3 Ông (Bà):</span><input list="staff-list" className="input-line flex-grow font-bold text-blue-800" value={formData.qlvh_daiDien3} onChange={e => setFormData({...formData, qlvh_daiDien3: e.target.value})} placeholder="Nhập tên (nếu có)..." /></div>
                                <div className="flex gap-2"><div className="flex items-center w-1/2 gap-1"><span className="text-sm">Chức vụ:</span><input list="position-list" className="input-line bg-transparent" value={formData.qlvh_chucVu3} onChange={e => setFormData({...formData, qlvh_chucVu3: e.target.value})} /></div><div className="flex items-center w-1/2 gap-1"><span className="text-sm">Đơn vị:</span><input list="unit-list" className="input-line bg-transparent" value={formData.qlvh_donVi3} onChange={e => setFormData({...formData, qlvh_donVi3: e.target.value})} /></div></div>
                            </div>

                        </div>
                    </div>

                    <div className="mb-4 pl-4"><div className="font-bold">3. Đại diện các đơn vị có liên quan:</div><textarea className="input-line pl-4 resize-none" rows="2" value={formData.dv_lienQuan} onChange={e => setFormData({...formData, dv_lienQuan: e.target.value})} placeholder="..."></textarea></div>

                    <div className="mb-4 text-justify text-black font-normal">Cùng nhau khảo sát thực tế, trao đổi và thống nhất phân công trách nhiệm thực hiện những nội dung để đảm bảo an toàn về điện cho Đơn vị công tác khi tiến hành công việc, cụ thể như sau:</div>

                    <div className="space-y-3 mb-6">
                    {/* --- MỤC 4: ĐỊA ĐIỂM (ĐÃ SỬA: NỐI TIẾP NỘI DUNG, KHÔNG XÓA CŨ) --- */}
                        <div>
                            <div className="flex flex-wrap items-center gap-2 mb-1">
                                <span className="font-bold">4. Địa điểm (hoặc thiết bị) thực hiện công việc:</span>
                                
                                <button 
                                onClick={() => {
                                    // 1. Logic tạo chuỗi địa điểm thông minh
                                    const truStart = formData.loc_poleCode || "...";
                                    const subStart = formData.loc_subCode ? "/" + formData.loc_subCode : "";
                                    const tuyen = formData.loc_lineName || "...";
                                    const xa = formData.loc_commune || "...";
                                    
                                    let textDiaDiem = "";
                                    
                                    if (formData.is_range) {
                                        // Chế độ dải
                                        const truEnd = formData.loc_poleCode_to || "...";
                                        const subEnd = formData.loc_subCode_to ? "/" + formData.loc_subCode_to : "";
                                        textDiaDiem = `từ trụ ${truStart}${subStart} đến trụ ${truEnd}${subEnd} tuyến ${tuyen}, xã ${xa}, tỉnh An Giang`;
                                    } else {
                                        // Chế độ đơn
                                        textDiaDiem = `tại trụ ${truStart}${subStart} tuyến ${tuyen}, xã ${xa}, tỉnh An Giang`;
                                    }

                                    // 2. Nối chuỗi như cũ
                                    const currentText = formData.muc4_diaDiem || "";
                                    const newText = currentText ? (currentText + " " + textDiaDiem) : textDiaDiem;
                                    setFormData({ ...formData, muc4_diaDiem: newText });
                                }}
                                    className="bg-blue-600 text-white px-2 py-0.5 rounded text-xs font-bold hover:bg-blue-700 active:scale-95 transition-all flex items-center gap-1 shadow-sm"
                                    title="Thêm địa điểm vào sau nội dung hiện tại"
                                >
                                    <UI_Icons.Plus size={12}/> Dán Đ.Điểm
                                </button>
                            </div>
                            <textarea 
                                className="input-line w-full resize-none font-medium text-blue-900" 
                                rows="2" 
                                value={formData.muc4_diaDiem} 
                                onChange={e => setFormData({...formData, muc4_diaDiem: e.target.value})}
                            ></textarea>
                        </div>

                    {/* --- MỤC 5: NỘI DUNG CÔNG VIỆC (CÓ DANH SÁCH MẪU) --- */}
                    <div className="mb-4">
                        <div className="flex flex-wrap items-center gap-2 mb-1">
                            <span className="font-bold">5. Nội dung công việc:</span>
                            
                            {/* Danh sách chọn mẫu */}
                            <select 
                                className="border rounded px-2 py-1 text-sm bg-gray-50 outline-none focus:border-blue-500"
                                value={selectedTaskTemplate}
                                onChange={(e) => setSelectedTaskTemplate(e.target.value)}
                            >
                                <option value="">-- Chọn mẫu --</option>
                                {taskTemplates.map((t, i) => <option key={i} value={t}>{t}</option>)}
                            </select>

                            {/* Nút Dán (+) */}
                            <button 
                                onClick={() => {
                                    if(!selectedTaskTemplate) return;
                                    // Dán nội dung mẫu vào ô nhập chính (có thể cộng dồn hoặc thay thế tùy bạn, ở đây tôi dùng cộng dồn)
                                    const newValue = formData.muc5_noiDung ? formData.muc5_noiDung + ", " + selectedTaskTemplate : selectedTaskTemplate;
                                    setFormData({...formData, muc5_noiDung: newValue});
                                }}
                                className="bg-blue-600 text-white px-3 py-1 rounded text-sm font-bold hover:bg-blue-700 active:scale-95 transition-all flex items-center gap-1"
                            >
                                <UI_Icons.Plus size={14}/> Dán
                            </button>
                        </div>
                        
                        {/* Ô nhập liệu chính Mục 5 (Đã sửa: Bỏ in đậm, dùng font-medium cho đều) */}
                        <textarea 
                            className="input-line w-full resize-none font-medium text-blue-900" // Sửa font-bold -> font-medium
                            rows="2" 
                            value={formData.muc5_noiDung} 
                            onChange={e => setFormData({...formData, muc5_noiDung: e.target.value})}
                        ></textarea>

                    </div>      

                    {/* --- MỤC 6: PHẠM VI (CÓ LIST CHỌN + NÚT DÁN TỰ ĐỘNG) --- */}
                        <div>
                            <div className="flex flex-wrap items-center gap-2 mb-1">
                                <span className="font-bold">6. Phạm vi làm việc:</span>
                                
                                {/* 1. List chọn mẫu */}
                                <select 
                                    className="border rounded px-2 py-1 text-sm bg-gray-50 outline-none focus:border-blue-500 max-w-[120px]"
                                    value={selectedScopeTemplate}
                                    onChange={(e) => setSelectedScopeTemplate(e.target.value)}
                                >
                                    <option value="">-- Mẫu --</option>
                                    {scopeTemplates.map((t, i) => <option key={i} value={t}>{t}</option>)}
                                </select>

                                {/* 2. Nút Dán từ List (+ Dán) */}
                                <button 
                                    onClick={() => {
                                        if(!selectedScopeTemplate) return;
                                        const cur = formData.muc6_phamVi;
                                        // Cộng dồn vào nội dung cũ
                                        setFormData({...formData, muc6_phamVi: cur ? cur + ", " + selectedScopeTemplate : selectedScopeTemplate});
                                    }}
                                    className="bg-blue-600 text-white px-2 py-0.5 rounded text-xs font-bold hover:bg-blue-700 active:scale-95 transition-all flex items-center gap-1 shadow-sm"
                                    title="Dán nội dung từ danh sách chọn"
                                >
                                    <UI_Icons.Plus size={12}/> Dán
                                </button>

                                {/* 3. Nút Dán Trụ/Tuyến tự động (+ Trụ/Tuyến) */}
                                <button 
                                    onClick={() => {
                                        // 1. Lấy thông tin Trụ đầu và Tuyến
                                        const truStart = formData.loc_poleCode || "...";
                                        const subStart = formData.loc_subCode ? "/" + formData.loc_subCode : ""; 
                                        const tuyen = formData.loc_lineName || "...";
                                        
                                        let textAuto = "";

                                        // 2. Kiểm tra chế độ: Dải hay Đơn
                                        if (formData.is_range) {
                                            // Chế độ Dải: Từ trụ... đến trụ...
                                            const truEnd = formData.loc_poleCode_to || "...";
                                            const subEnd = formData.loc_subCode_to ? "/" + formData.loc_subCode_to : "";
                                            textAuto = `từ trụ ${truStart}${subStart} đến trụ ${truEnd}${subEnd} tuyến ${tuyen}`;
                                        } else {
                                            // Chế độ Đơn: Trụ...
                                            textAuto = `trụ ${truStart}${subStart} tuyến ${tuyen}`;
                                        }

                                        // 3. Cộng dồn vào nội dung hiện có
                                        const cur = formData.muc6_phamVi;
                                        setFormData({
                                            ...formData, 
                                            muc6_phamVi: cur ? cur + " " + textAuto : textAuto
                                        });
                                    }}
                                    className="bg-blue-600 text-white px-2 py-0.5 rounded text-xs font-bold hover:bg-blue-700 active:scale-95 transition-all flex items-center gap-1 shadow-sm"
                                    title="Tự động điền phạm vi trụ/tuyến"
                                >
                                    <UI_Icons.Plus size={12}/> Trụ/Tuyến
                                </button>
                            </div>
                            
                            {/* Ô nhập liệu chính Mục 6 (Đã sửa: Có thanh cuộn giống Mục 4) */}
                            <textarea 
                                className="input-line w-full resize-none font-medium text-blue-800" // Đã xóa overflow-hidden
                                rows="2" 
                                value={formData.muc6_phamVi} 
                                onChange={e => setFormData({...formData, muc6_phamVi: e.target.value})}
                            ></textarea>

                        </div>
                    
                    {/* Mục 7 với Input Date */}
                    <div><span className="font-bold">7. Thời gian tiến hành công việc:</span><div className="flex flex-wrap items-center gap-2 mt-1">Từ <div className="mx-1"><TimeSelect value={formData.muc7_thoiGianTu} onChange={(val) => setFormData({...formData, muc7_thoiGianTu: val})} /></div>đến <div className="mx-1"><TimeSelect value={formData.muc7_thoiGianDen} onChange={(val) => setFormData({...formData, muc7_thoiGianDen: val})} /></div>, ngày <input type="date" className="border-b border-gray-300 font-bold bg-transparent outline-none px-1 text-blue-800" value={formData.muc7_ngay} onChange={e => setFormData({...formData, muc7_ngay: e.target.value})} /></div></div></div>

                    <div className="mb-6"><div className="font-bold mb-2">8. Kết quả Đánh giá rủi ro của đơn vị công tác:</div><div className="pl-4">
                        
                        {/* Mục 8a với Input Date */}
                        <div className="font-semibold mb-2 flex flex-wrap items-center gap-1">a) Kết quả ĐGRR tại hiện trường (Theo Phiếu ĐGRR ngày <input type="date" className="border-b border-gray-400 outline-none px-1 font-bold bg-transparent text-blue-800" value={formData.phieu_dgrr_ngay} onChange={e => setFormData({...formData, phieu_dgrr_ngay: e.target.value})} />)</div>
                        
                        <table className="w-full">
                        {/* --- BẮT ĐẦU HEADER BẢNG 8.A (ĐÃ SỬA GIỐNG HÌNH) --- */}
                        <thead>
                            <tr>
                                <th rowSpan="2" className="w-10 border border-gray-300 bg-gray-100 p-2 text-center align-middle">STT</th>
                                <th rowSpan="2" className="w-1/4 border border-gray-300 bg-gray-100 p-2 text-center align-middle">Nhận diện mối nguy</th>
                                <th rowSpan="2" className="w-1/4 border border-gray-300 bg-gray-100 p-2 text-center align-middle">Mô tả mối nguy</th>
                                <th colSpan="2" className="border border-gray-300 bg-gray-100 p-2 text-center">Kết quả ĐGRR</th>
                                <th rowSpan="2" className="w-8 border border-gray-300 bg-gray-100 p-2"></th>
                            </tr>
                            <tr>
                                <th className="w-24 border border-gray-300 bg-gray-100 p-2 text-center">Bậc rủi ro sau kiểm soát</th>
                                <th className="border border-gray-300 bg-gray-100 p-2 text-center">Biện pháp kiểm soát rủi ro khi thực hiện</th>
                            </tr>
                        </thead>
                        {/* --- KẾT THÚC HEADER --- */}
                        <tbody><tr><td colSpan="6" className="bg-gray-100 font-bold text-center text-blue-700 uppercase tracking-wide">ATLĐ (An toàn lao động)</td></tr>{formData.ruiRo_ATLD.map((item, index) => (<tr key={`atld-${index}`}><td className="text-center">{index + 1}</td><td><select className="w-full border-none outline-none bg-transparent cursor-pointer font-medium text-blue-900" value={item.riskId || ""} onChange={(e) => handleRiskTypeChange('ruiRo_ATLD', index, e)}><option value="">-- Chọn Mối nguy --</option>{riskLibrary.risks.filter(r => r.loai !== 'VSLD').map(r => <option key={r.id} value={r.id}>{r.ten_moi_nguy}</option>)}</select>{!item.riskId && <input className="w-full text-xs border-t mt-1 placeholder-gray-400" placeholder="Hoặc nhập tay..." value={item.moiNguy} onChange={(e) => updateRiskRowManual('ruiRo_ATLD', index, 'moiNguy', e.target.value)} />}</td><td className="cursor-pointer hover:bg-blue-50 relative group" onClick={() => openRiskModal('ruiRo_ATLD', index, 'moTa')}><div className="min-h-[3rem] whitespace-pre-wrap">{item.moTa || <span className="text-gray-400 italic text-xs">Chạm để chọn...</span>}</div><div className="absolute top-1 right-1 opacity-0 group-hover:opacity-100"><UI_Icons.CheckSquare size={14} className="text-blue-500"/></div></td><td><select className="w-full text-center border-none outline-none bg-transparent cursor-pointer font-bold" value={item.bac} onChange={(e) => updateRiskRowManual('ruiRo_ATLD', index, 'bac', e.target.value)}><option value="I">I</option><option value="II">II</option><option value="III">III</option><option value="IV">IV</option><option value="V">V</option></select></td><td className="cursor-pointer hover:bg-blue-50 relative group" onClick={() => openRiskModal('ruiRo_ATLD', index, 'bienPhap')}><div className="min-h-[3rem] whitespace-pre-wrap">{item.bienPhap || <span className="text-gray-400 italic text-xs">Chạm để chọn...</span>}</div><div className="absolute top-1 right-1 opacity-0 group-hover:opacity-100"><UI_Icons.CheckSquare size={14} className="text-blue-500"/></div></td><td className="text-center align-middle"><button onClick={() => removeRiskRow('ATLD', index)} className="text-red-500"><UI_Icons.Trash2 width="16"/></button></td></tr>))}<tr><td colSpan="6" className="text-center p-1"><button onClick={() => addRiskRow('ATLD')} className="text-sm text-blue-600 font-semibold flex items-center justify-center gap-1 w-full"><UI_Icons.Plus width="14"/> Thêm dòng ATLĐ</button></td></tr><tr><td colSpan="6" className="bg-gray-100 font-bold text-center text-green-700 uppercase tracking-wide">VSLĐ (Vệ sinh lao động)</td></tr>{formData.ruiRo_VSLD.map((item, index) => (<tr key={`vsld-${index}`}><td className="text-center">{index + 1}</td><td><select className="w-full border-none outline-none bg-transparent cursor-pointer font-medium text-green-900" value={item.riskId || ""} onChange={(e) => handleRiskTypeChange('ruiRo_VSLD', index, e)}><option value="">-- Chọn Mối nguy --</option>{riskLibrary.risks.filter(r => r.loai === 'VSLD').map(r => <option key={r.id} value={r.id}>{r.ten_moi_nguy}</option>)}</select>{!item.riskId && <input className="w-full text-xs border-t mt-1 placeholder-gray-400" placeholder="Hoặc nhập tay..." value={item.moiNguy} onChange={(e) => updateRiskRowManual('ruiRo_VSLD', index, 'moiNguy', e.target.value)} />}</td><td className="cursor-pointer hover:bg-green-50 relative group" onClick={() => openRiskModal('ruiRo_VSLD', index, 'moTa')}><div className="min-h-[3rem] whitespace-pre-wrap">{item.moTa || <span className="text-gray-400 italic text-xs">Chạm để chọn...</span>}</div><div className="absolute top-1 right-1 opacity-0 group-hover:opacity-100"><UI_Icons.CheckSquare size={14} className="text-green-500"/></div></td><td><select className="w-full text-center border-none outline-none bg-transparent cursor-pointer font-bold" value={item.bac} onChange={(e) => updateRiskRowManual('ruiRo_VSLD', index, 'bac', e.target.value)}><option value="I">I</option><option value="II">II</option><option value="III">III</option><option value="IV">IV</option><option value="V">V</option></select></td><td className="cursor-pointer hover:bg-green-50 relative group" onClick={() => openRiskModal('ruiRo_VSLD', index, 'bienPhap')}><div className="min-h-[3rem] whitespace-pre-wrap">{item.bienPhap || <span className="text-gray-400 italic text-xs">Chạm để chọn...</span>}</div><div className="absolute top-1 right-1 opacity-0 group-hover:opacity-100"><UI_Icons.CheckSquare size={14} className="text-green-500"/></div></td><td className="text-center align-middle"><button onClick={() => removeRiskRow('VSLD', index)} className="text-red-500"><UI_Icons.Trash2 width="16"/></button></td></tr>))}<tr><td colSpan="6" className="text-center p-1"><button onClick={() => addRiskRow('VSLD')} className="text-sm text-green-600 font-semibold flex items-center justify-center gap-1 w-full"><UI_Icons.Plus width="14"/> Thêm dòng VSLĐ</button></td></tr></tbody></table><div className="font-semibold">b) Ghi chú:</div><textarea className="input-line" rows="4" value={formData.ruiRo_ghiChu} onChange={e => setFormData({...formData, ruiRo_ghiChu: e.target.value})} placeholder="Các biện pháp bổ sung..."></textarea></div></div>

                    <div className="mb-6"><div className="font-bold mb-2">9. Trách nhiệm của các đơn vị liên quan:</div><div className="pl-4 space-y-4"><QuickInputSection title="a/ Đối với (các) đơn vị quản lý vận hành (Thực hiện cắt điện):" value={formData.muc9a_catDien} onChange={(val) => setFormData({...formData, muc9a_catDien: val})} templates={tags9a} contextData={getContextData()} placeholder="- Cắt CB..." /><QuickInputSection title="b/ Đối với đơn vị công tác (Biện pháp an toàn):" value={formData.muc9b_anToan} onChange={(val) => setFormData({...formData, muc9b_anToan: val})} templates={tags9b} placeholder="- Chuẩn bị..." /><div><label className="section-title block text-gray-800">c/ Đối với (các) đơn vị điều độ (nếu có):</label><textarea className="input-line" rows="2" value={formData.muc9c_dieuDo} onChange={e => setFormData({...formData, muc9c_dieuDo: e.target.value})}></textarea></div><div><label className="section-title block text-gray-800">d/ Những nội dung khác có liên quan đến công việc:</label><textarea className="input-line" rows="2" value={formData.muc9d_khac} onChange={e => setFormData({...formData, muc9d_khac: e.target.value})}></textarea></div></div></div>
                    <div className="mt-8 text-justify mb-8">Biên bản này được lập thành <input className="w-10 text-center border-b border-gray-300 font-bold" value={formData.soBan} onChange={e => setFormData({...formData, soBan: e.target.value})} /> bản và được tất cả mọi người dự họp là đại diện của các đơn vị có liên quan đến công việc đồng ý, thông qua để làm cơ sở tiến hành công việc sau này (nếu không thay đổi về những nội dung chính) và ký tên dưới đây.</div>
                    <div className="grid grid-cols-2 gap-8 text-center font-bold text-xs md:text-sm uppercase mb-20"><div>ĐẠI DIỆN ĐƠN VỊ<br/>LÀM CÔNG VIỆC<br/><div className="h-20"></div>{formData.dvct_daiDien1}</div><div>ĐẠI DIỆN (CÁC) ĐƠN VỊ<br/>QUẢN LÝ VH<br/><div className="h-20"></div>{formData.qlvh_daiDien1}</div><div>ĐẠI DIỆN (CÁC)<br/>ĐƠN VỊ ĐIỀU ĐỘ<br/><div className="h-20"></div></div><div>ĐẠI DIỆN CÁC<br/>ĐƠN VỊ LIÊN QUAN<br/><div className="h-20"></div></div></div>
                    
                    {/* Phần Chụp Ảnh Mới */}
                    <div className="mb-8 border-t-2 border-dashed pt-4 break-inside-avoid">
                        <div className="font-bold text-center mb-4 flex justify-between items-center px-4">
                            <span>HÌNH ẢNH KHẢO SÁT (Lưu nội bộ)</span>
                            <label className="camera-btn px-4 py-2 rounded-full cursor-pointer flex items-center gap-2 font-bold text-sm shadow-sm">
                                <UI_Icons.Plus size={18}/> Chụp/Tải Ảnh
                                <input type="file" accept="image/*" multiple capture="environment" className="hidden" onChange={handleImageUpload} />
                            </label>
                        </div>
                        {(!formData.hinh_anh || formData.hinh_anh.length === 0) ? (
                            <div className="text-center text-gray-400 italic py-4 bg-gray-50 rounded border border-gray-200">Chưa có hình ảnh nào.</div>
                        ) : (
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                {formData.hinh_anh.map((url, index) => (
                                    <div key={index} className="relative group aspect-square bg-gray-100 rounded-lg overflow-hidden border border-gray-300 shadow-sm cursor-zoom-in" onClick={() => setZoomImage(url)}>
                                        <img src={url} alt={`Ảnh ${index+1}`} className="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" />
                                        {/* Nút xóa (cần stopPropagation để không bị kích hoạt zoom khi bấm xóa) */}
                                        <button onClick={(e) => { e.stopPropagation(); removeImage(index); }} className="absolute top-1 right-1 bg-red-500 text-white rounded-full p-1 opacity-80 hover:opacity-100 shadow-md transition-opacity"><UI_Icons.X size={14}/></button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    <div className="border-t-2 border-dashed pt-4 mt-8 break-inside-avoid"><div className="font-bold text-center mb-4">SƠ ĐỒ MỘT SỢI KẾT NỐI THIẾT BỊ, LƯỚI ĐIỆN NƠI LÀM VIỆC</div><div className="relative w-full h-80 bg-gray-50 border border-gray-300 rounded-lg overflow-hidden group">{diagramData.length > 0 ?
(<DiagramPreview objects={diagramData} />) : (<div className="absolute inset-0 flex flex-col items-center justify-center text-gray-400"><UI_Icons.Share2 size={48} className="mb-2"/><span>(Chưa có sơ đồ)</span></div>)}<div className="absolute inset-0 bg-black/5 group-hover:bg-black/10 transition-colors flex items-center justify-center opacity-0 group-hover:opacity-100"><button onClick={() => setShowDiagram(true)} className="bg-blue-600 text-white px-4 py-2 rounded-lg shadow-lg font-bold hover:bg-blue-700 transform hover:scale-105 transition-all flex items-center gap-2"><UI_Icons.FileText size={18}/> {diagramData.length > 0 ? "Chỉnh Sửa Sơ Đồ" : "Mở Trình Vẽ Sơ Đồ"}</button></div>{diagramData.length === 0 && (<div className="absolute inset-0 flex items-center justify-center md:hidden pointer-events-none"><div className="mt-16 pointer-events-auto"><button onClick={() => setShowDiagram(true)} className="bg-blue-100 text-blue-600 px-4 py-2 rounded text-sm font-semibold hover:bg-blue-200">Mở Trình Vẽ Sơ Đồ</button></div></div>)}</div></div>
                </div>
                <div className="h-20"></div>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
